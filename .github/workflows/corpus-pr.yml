name: Corpus PR
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: corpus-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Schemas, registry and examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Check the registry and the schema examples
        run: python -B scripts/check_contract.py
      - name: Test the contract rules
        run: python -B -m unittest discover -s tests -v
