name: Corpus PR
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: corpus-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Schemas, registry and examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # The history check reads the base revision.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Check the registry and the schema examples
        run: python -B scripts/check_contract.py
      - name: Check the lifecycle logs and definition digests
        run: python -B scripts/check_lifecycle.py
      - name: Check the change against its base revision
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python -B scripts/check_history.py --base "$BASE"
      - name: Test the contract rules
        run: python -B -m unittest discover -s tests -v
